name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cd-lambda-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir ambiente pela branch
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "environment=prod" >> "$GITHUB_OUTPUT";
          else echo "environment=homolog" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }

      - name: Garante bucket do state Terraform
        run: |
          BUCKET=tc-fiap-oficina-tfstate-512135631497
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi

      - name: Terraform apply
        run: |
          terraform -chdir=terraform init \
            -backend-config="key=fase-3/lambda-auth-${{ steps.env.outputs.environment }}.tfstate"
          terraform -chdir=terraform apply -auto-approve \
            -var "environment=${{ steps.env.outputs.environment }}"

      - name: Smoke test
        run: |
          ENV=${{ steps.env.outputs.environment }}
          API=$(terraform -chdir=terraform output -raw api_endpoint)
          OS_URL=$(terraform -chdir=terraform output -raw os_service_url)
          echo "API: $API"
          echo "os-service: $OS_URL"
          echo "Serviços roteados: $(terraform -chdir=terraform output -json servicos_roteados)"

          espera() { # uso: espera <status esperado> <descricao> <args do curl...>
            local esperado=$1 descricao=$2
            shift 2
            local veio
            veio=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            [ "$veio" = "$esperado" ] || { echo "FALHA: $descricao: esperado $esperado, veio $veio"; exit 1; }
            echo "ok: $descricao ($veio)"
          }

          # Gateway + Lambda token vivos
          espera 400 "token com CPF malformado" -X POST "$API/auth/token" \
            -H 'content-type: application/json' -d '{"cpf":"000"}'

          # Endpoint interno do os-service existe (guard responde 401 sem chave)
          # e a chave do SSM confere (404 = CPF sem cadastro).
          # 98765432100 é um CPF válido que não colide com o seed (11144477735/52998224725).
          KEY=$(aws ssm get-parameter --name "/oficina/$ENV/internal-api-key" \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          espera 401 "endpoint interno sem chave" "$OS_URL/internal/clientes/por-documento/98765432100"
          espera 404 "endpoint interno com chave" -H "x-internal-api-key: $KEY" \
            "$OS_URL/internal/clientes/por-documento/98765432100"

          # Cadeia Lambda -> SSM -> os-service: CPF válido sem cadastro
          espera 401 "token com CPF sem cadastro" -X POST "$API/auth/token" \
            -H 'content-type: application/json' -d '{"cpf":"98765432100"}'

          # Borda
          espera 401 "rota de cliente sem token" "$API/os/acompanhamento/OS-SMOKE"
          espera 403 "/internal bloqueado no gateway" "$API/internal/clientes/por-documento/98765432100"
