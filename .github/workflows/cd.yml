name: CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: cd-lambda-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir ambiente pela branch
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "environment=prod" >> "$GITHUB_OUTPUT";
          else echo "environment=homolog" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }

      - name: Garante bucket do state Terraform
        run: |
          BUCKET=tc-fiap-oficina-tfstate-076155200589
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi

      - name: Terraform apply
        run: |
          terraform -chdir=terraform init \
            -backend-config="key=fase-3/lambda-auth-${{ steps.env.outputs.environment }}.tfstate"
          terraform -chdir=terraform apply -auto-approve \
            -var "environment=${{ steps.env.outputs.environment }}"

      - name: Smoke test
        run: |
          API=$(terraform -chdir=terraform output -raw api_endpoint)
          echo "API: $API"
          # CPF inválido deve responder 400 (prova que gateway+lambda estão vivos)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/auth/token" \
            -H 'content-type: application/json' -d '{"cpf":"000"}')
          [ "$code" = "400" ] || { echo "esperado 400, veio $code"; exit 1; }
